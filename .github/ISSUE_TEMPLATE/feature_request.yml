name: Feature request
description: Propose a focused m-phone, App SDK, or Widget SDK improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and target surface.
    validations:
      required: true

  - type: dropdown
    id: ownership
    attributes:
      label: Best ownership boundary
      options:
        - m-phone core
        - Phone App
        - Tablet App
        - App SDK
        - Widget SDK
        - Separate domain resource
        - Unsure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require committing private keys or player data.
          required: true
