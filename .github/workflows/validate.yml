name: Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Runtime and documentation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Lua parser
        run: npm install --global luaparse@0.3.1

      - name: Validate release package
        shell: pwsh
        run: ./.github/scripts/validate-release.ps1
